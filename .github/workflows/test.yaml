name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    name: generator, abap2UI5 linter, abap2UI5 runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the catalogue against UI5 1.71, the class format, the chain against
      # a model of the view builder
      - run: npm test
      # every control, property and icon against 1.71, the house layout
      - run: npm run check:abap
      # transpiled against abap2UI5, run on it: the view, the model and
      # every event as the designer shows them
      - run: npm run verify:abap

  browser:
    name: designer in the browser (UI5 current and 1.71)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
